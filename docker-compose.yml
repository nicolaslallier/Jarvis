services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgres://jarvis:${JARVIS_DB_PASSWORD}@postgres:5432/jarvis
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      APP_ENV: ${APP_ENV:-development}
      LMSTUDIO_BASE_URL: ${LMSTUDIO_BASE_URL:-http://host.docker.internal:1234}
      LMSTUDIO_MODEL: ${LMSTUDIO_MODEL:-google/gemma-4-26b-a4b-qat}
      EMBEDDING_LMSTUDIO_BASE_URL: ${EMBEDDING_LMSTUDIO_BASE_URL:-http://host.docker.internal:1234}
      EMBEDDING_LMSTUDIO_MODEL: ${EMBEDDING_LMSTUDIO_MODEL:-text-embedding-nomic-embed-text-v1.5}
      RAG_TOP_K: ${RAG_TOP_K:-4}
      MEMORY_TOP_K: ${MEMORY_TOP_K:-6}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://alloy:4318}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-jarvis-api}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-http://minio:9000}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET: ${MINIO_BUCKET:-jarvis}
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672/
    ports:
      - "${API_PORT:-8000}:8000"
    extra_hosts:
      # `host.docker.internal` resolves out of the box on Docker Desktop
      # (Mac/Windows); this mapping makes it also resolve on Linux hosts.
      - "host.docker.internal:host-gateway"
    networks:
      infra-net:
        aliases:
          - jarvis-api

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Vite bakes this in at `npm run build` time — it must be a
        # build arg, not a runtime `environment:` entry (which the
        # already-built static JS bundle can never see).
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    env_file: .env
    depends_on:
      - api
    restart: unless-stopped
    healthcheck:
      # 127.0.0.1, not localhost — inside this container localhost can
      # resolve to ::1, and nginx here only binds the IPv4 wildcard,
      # which turns the check into a false-positive "unhealthy".
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - infra-net

  batch:
    build:
      context: .
      dockerfile: batch/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgres://jarvis:${JARVIS_DB_PASSWORD}@postgres:5432/jarvis
      APP_ENV: ${APP_ENV:-development}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://alloy:4318}
      OTEL_SERVICE_NAME: ${BATCH_OTEL_SERVICE_NAME:-jarvis-batch}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-http://minio:9000}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET: ${MINIO_BUCKET:-jarvis}
      BATCH_JOB_INTERVAL_MINUTES: ${BATCH_JOB_INTERVAL_MINUTES:-15}
      INGEST_CONTAINER_NAME: ${INGEST_CONTAINER_NAME:-jarvis-ingest}
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672/
      DOCKER_PROXY_URL: ${DOCKER_PROXY_URL:-tcp://docker-socket-proxy:2375}
      IMAP_HOST: ${IMAP_HOST:-}
      IMAP_USERNAME: ${IMAP_USERNAME:-}
      IMAP_PASSWORD: ${IMAP_PASSWORD:-}
      IMAP_FOLDER: ${IMAP_FOLDER:-INBOX}
      LMSTUDIO_BASE_URL: ${LMSTUDIO_BASE_URL:-http://host.docker.internal:1234}
      LMSTUDIO_MODEL: ${LMSTUDIO_MODEL:-google/gemma-4-26b-a4b-qat}
    extra_hosts:
      # Same reasoning as the `api`/`ingest` services' extra_hosts: batch's
      # email_ingest job now also calls LM Studio at host.docker.internal by
      # default, which only resolves out of the box on Docker Desktop
      # (Mac/Windows) — this mapping makes it also resolve on Linux hosts.
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      infra-net:
        aliases:
          - jarvis-batch
      docker-proxy-net: {}

  # Scopes batch's Docker access down from the raw daemon socket (root-
  # equivalent) to just the CONTAINERS API resource — see CLAUDE.md's
  # "Security note on ingest_trigger" for what that grants/doesn't grant.
  # Only reachable from `batch` via the isolated `docker-proxy-net` network
  # below, not from `infra-net`.
  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:latest
    restart: unless-stopped
    environment:
      CONTAINERS: 1
      POST: 1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - docker-proxy-net

  # Normally stopped ("Exited") — does one ingestion pass and exits.
  # batch's ingest_trigger job starts it (via the Docker socket) whenever
  # there are unprocessed files; `restart: "no"` means it goes back to
  # "Exited" on its own once that pass finishes, rather than looping.
  ingest:
    build:
      context: .
      dockerfile: ingest/Dockerfile
    container_name: jarvis-ingest
    env_file: .env
    environment:
      DATABASE_URL: postgres://jarvis:${JARVIS_DB_PASSWORD}@postgres:5432/jarvis
      APP_ENV: ${APP_ENV:-development}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://alloy:4318}
      OTEL_SERVICE_NAME: ${INGEST_OTEL_SERVICE_NAME:-jarvis-ingest}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-http://minio:9000}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET: ${MINIO_BUCKET:-jarvis}
      EMBEDDING_LMSTUDIO_BASE_URL: ${EMBEDDING_LMSTUDIO_BASE_URL:-http://host.docker.internal:1234}
      EMBEDDING_LMSTUDIO_MODEL: ${EMBEDDING_LMSTUDIO_MODEL:-text-embedding-nomic-embed-text-v1.5}
      VISION_LMSTUDIO_BASE_URL: ${VISION_LMSTUDIO_BASE_URL:-http://host.docker.internal:1234}
      VISION_LMSTUDIO_MODEL: ${VISION_LMSTUDIO_MODEL:-qwen/qwen3.6-35b-a3b}
      INGEST_CHUNK_SIZE_CHARS: ${INGEST_CHUNK_SIZE_CHARS:-1000}
      INGEST_CHUNK_OVERLAP_CHARS: ${INGEST_CHUNK_OVERLAP_CHARS:-150}
    restart: "no"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - infra-net

# `postgres` lives in the separate Infra repo's own Compose project, so it
# can't be referenced via `depends_on` here. Make sure the Infra stack
# (docker compose up in /Users/nicolaslallier/Claude/Infra) is already
# running before starting the `api`/`batch`/`ingest` services — all three
# connect to Infra's Postgres and MinIO over infra-net, and `api`/`batch`
# also connect to Infra's RabbitMQ (`rabbitmq:5672`) for the on-demand
# ingest trigger (see CLAUDE.md's "Ingestion" section). `frontend` is on
# infra-net so the Infra repo's shared NGINX can reverse-proxy it at
# jarvis.infra.famillelallier.net (see nginx/conf.d/jarvis.conf there).
networks:
  infra-net:
    external: true
  # Isolated bridge network shared only by `batch` and `docker-socket-proxy`
  # so nothing else in the compose project (or on infra-net) can reach the
  # proxy's Docker API surface.
  docker-proxy-net: {}
