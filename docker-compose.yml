services:
  api:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgres://jarvis:${JARVIS_DB_PASSWORD}@postgres:5432/jarvis
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      APP_ENV: ${APP_ENV:-development}
    ports:
      - "${API_PORT:-8000}:8000"
    networks:
      - infra-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    env_file: .env
    environment:
      - VITE_API_URL=${VITE_API_URL:-http://localhost:8000}
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    depends_on:
      - api
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

# `postgres` lives in the separate Infra repo's own Compose project, so it
# can't be referenced via `depends_on` here. Make sure the Infra stack
# (docker compose up in /Users/nicolaslallier/Claude/Infra) is already
# running before starting the `api` service. `frontend` only talks to `api`
# via the browser hitting its published host port, so it doesn't need
# infra-net.
networks:
  infra-net:
    external: true
